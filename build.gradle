plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Diese Dateien gibt es nicht mehr - ihr Inhalt steckt jetzt in anderen Dateien (damit es unter 100 Dateien
// bleibt). Hochladen im Browser loescht nichts: liegen sie noch alt im Repository, werden sie einfach nicht
// mitgebaut.
sourceSets {
    main {
        java {
            exclude(
                    'de/test/DropScreen.java',
                    'de/test/LanguageScreen.java',
                    'de/test/LevelScreen.java',
                    'de/test/ClickerScreen.java',
                    'de/test/BlockPickScreen.java',
                    'de/test/BindsScreen.java',
                    'de/test/ProfileScreen.java',
                    'de/test/KillAuraScreen.java',
                    'de/test/BotGuardScreen.java',
                    'de/test/TunnelScreen.java',
                    'de/test/GotoScreen.java',
                    'de/test/BlockScreen.java',
                    'de/test/AreaScreen.java',
                    'de/test/DesignScreen.java',
                    'de/test/InvSlotScreen.java',
                    'de/test/InvLayoutScreen.java',
                    'de/test/EspScreen.java',
                    'de/test/Brand.java',
                    'de/test/BetterTooltips.java',
                    'de/test/BlockScan.java',
                    'de/test/PathWorld.java',
                    'de/test/SwarmNet.java',
                    'de/test/PlayerScreens.java',
                    // entfernte Module
                    'de/test/BossStack.java',
                    'de/test/BotGuard.java'
            )
        }
    }
}

// Dateiname ohne Versionsnummer: 1912-Utilities.jar (statt 1912-Utilities-1.0.0.jar)
tasks.withType(Jar).configureEach {
    archiveVersion.set('')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
